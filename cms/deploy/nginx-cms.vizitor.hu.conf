# /etc/nginx/sites-available/cms.vizitor.hu → symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Certificate: sudo certbot --nginx -d cms.vizitor.hu  (certbot fills in the ssl_certificate lines)
server {
    listen 80;
    listen [::]:80;
    server_name cms.vizitor.hu;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.vizitor.hu;
    # ssl_certificate     /etc/letsencrypt/live/cms.vizitor.hu/fullchain.pem;  # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/cms.vizitor.hu/privkey.pem;    # managed by certbot
    client_max_body_size 25m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
